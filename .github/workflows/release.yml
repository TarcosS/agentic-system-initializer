name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: packages/cli
        run: npm ci

      - name: Build
        working-directory: packages/cli
        run: npm run build

      - name: Run tests
        working-directory: packages/cli
        run: npm run test

      - name: Generate release notes
        id: notes
        run: |
          # Extract version from tag
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Extract changelog section for this version
          sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$ d' > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────────────────────────
      # CDN Deploy — split sections and upload to Azure Blob Storage
      # ─────────────────────────────────────────────────────────────────
      - name: Split sections
        run: npx tsx scripts/split-sections.ts .

      - name: Upload sections to Azure CDN
        run: ./scripts/upload-cdn.sh
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          AZURE_CDN_PROFILE: ${{ secrets.AZURE_CDN_PROFILE }}
          AZURE_CDN_ENDPOINT: ${{ secrets.AZURE_CDN_ENDPOINT }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}

      # ─────────────────────────────────────────────────────────────────
      # NPM Publish — uncomment when ready to publish publicly
      # ─────────────────────────────────────────────────────────────────
      # - name: Publish to npm
      #   working-directory: packages/cli
      #   run: npm publish --access public
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
